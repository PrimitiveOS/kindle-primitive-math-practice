[workspace]
resolver = "2"
members = ["crates/math-practice-core", "crates/math-practice-render", "crates/math-practice-kindle", "crates/math-practice-desktop"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
math-practice-core = { path = "crates/math-practice-core" }
math-practice-render = { path = "crates/math-practice-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
